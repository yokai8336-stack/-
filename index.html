<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#fffaf5">
<title>ベビキッズ｜子供も楽しい、親も楽しい。</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#f5f3ef;
  color:#252525;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
}
button{font:inherit}
.app{
  width:100%;
  max-width:560px;
  margin:auto;
  min-height:100vh;
  background:#fffaf5;
  overflow:hidden;
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,250,245,.94);
  backdrop-filter:blur(16px);
  padding:14px 18px 10px;
  border-bottom:1px solid #eee7df;
}
.logo{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo h1{
  margin:0;
  font-size:23px;
  letter-spacing:-1px;
}
.logo h1 span{color:#ff6b5e}
.tagline{
  margin:3px 0 0;
  color:#777;
  font-size:11px;
}
.header-actions{
  display:flex;
  gap:8px;
}
.icon-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

/* NAV */
.nav{
  display:flex;
  gap:6px;
  padding:9px 14px;
  overflow-x:auto;
}
.nav button{
  flex:none;
  border:1px solid #e7ded5;
  background:white;
  padding:8px 13px;
  border-radius:20px;
  font-size:12px;
}
.nav button.active{
  background:#252525;
  color:white;
  border-color:#252525;
}

/* HERO */
.hero{
  padding:18px 18px 4px;
}
.hero h2{
  margin:0;
  font-size:28px;
  line-height:1.25;
  letter-spacing:-1.5px;
}
.hero h2 span{color:#ff6b5e}
.hero p{
  margin:8px 0 0;
  color:#777;
  font-size:13px;
  line-height:1.7;
}

/* CARD AREA */
.deck{
  position:relative;
  height:650px;
  margin:12px 14px 0;
}
.card{
  position:absolute;
  inset:0;
  background:#fff;
  border-radius:26px;
  overflow:hidden;
  box-shadow:0 12px 40px rgba(42,31,22,.15);
  transition:transform .35s ease,opacity .35s ease;
  touch-action:none;
}
.card-image{
  height:285px;
  position:relative;
  background:
    linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.65)),
    linear-gradient(135deg,#78a88a,#d9c89d);
  display:flex;
  align-items:flex-end;
  padding:18px;
  color:#fff;
}
.card[data-id="halekulani"] .card-image{
  background:
    linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.7)),
    linear-gradient(135deg,#6eb5c7,#f3d8b0);
}
.card[data-id="haimuru"] .card-image{
  background:
    linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.7)),
    linear-gradient(135deg,#36a9c1,#75d1ad);
}
.card[data-id="shigira"] .card-image{
  background:
    linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.7)),
    linear-gradient(135deg,#27a8c7,#f0c56c);
}
.card[data-id="key"] .card-image{
  background:
    linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.7)),
    linear-gradient(135deg,#315b45,#b5c58b);
}
.card[data-id="tomamu"] .card-image{
  background:
    linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.7)),
    linear-gradient(135deg,#5577a5,#f3d69c);
}
.card[data-id="yatsugatake"] .card-image{
  background:
    linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.7)),
    linear-gradient(135deg,#6b8c65,#e0c38c);
}

.badge{
  position:absolute;
  top:16px;
  left:16px;
  background:#ff6b5e;
  color:#fff;
  border-radius:20px;
  padding:7px 11px;
  font-weight:700;
  font-size:11px;
}
.favorite{
  position:absolute;
  top:14px;
  right:14px;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.9);
  font-size:20px;
}
.place{
  font-size:11px;
  opacity:.9;
}
.card-title{
  margin:3px 0 0;
  font-size:23px;
  line-height:1.2;
  font-weight:800;
}
.card-body{
  padding:15px 17px;
}
.score-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.score{
  font-size:28px;
  font-weight:900;
}
.score small{
  font-size:11px;
  color:#999;
  font-weight:500;
}
.tags{
  display:flex;
  gap:6px;
  overflow:hidden;
  margin:10px 0;
}
.tag{
  white-space:nowrap;
  background:#f6f1eb;
  padding:6px 9px;
  border-radius:10px;
  font-size:10px;
}
.experience{
  font-size:13px;
  line-height:1.7;
  color:#555;
  margin:8px 0;
}
.experience strong{color:#222}
.mini-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}
.mini{
  background:#faf7f3;
  border-radius:10px;
  padding:7px 5px;
  text-align:center;
}
.mini b{
  display:block;
  font-size:15px;
}
.mini span{
  display:block;
  color:#999;
  font-size:9px;
}

/* SWIPE BUTTONS */
.swipe-actions{
  display:flex;
  justify-content:center;
  gap:18px;
  margin:16px 0 24px;
}
.swipe-btn{
  border:0;
  border-radius:50%;
  width:62px;
  height:62px;
  background:#fff;
  box-shadow:0 7px 22px rgba(0,0,0,.12);
  font-size:25px;
}
.swipe-btn.no{
  color:#777;
}
.swipe-btn.yes{
  color:#ff5c68;
}

/* SECTION */
.section{
  padding:20px 18px;
}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:12px;
}
.section h3{
  margin:0;
  font-size:20px;
}
.section-head span{
  color:#999;
  font-size:11px;
}
.sale{
  background:#252525;
  color:white;
  border-radius:22px;
  padding:18px;
  margin-bottom:10px;
  position:relative;
  overflow:hidden;
}
.sale:after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  background:#ff6b5e;
  opacity:.18;
  right:-35px;
  top:-35px;
}
.sale .sale-label{
  display:inline-block;
  background:#ff6b5e;
  padding:5px 8px;
  border-radius:7px;
  font-size:9px;
  font-weight:800;
}
.sale h4{
  margin:9px 0 4px;
  font-size:17px;
}
.sale p{
  margin:0;
  color:#ccc;
  font-size:11px;
  line-height:1.6;
}
.sale-buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.sale-buttons button{
  border:1px solid #555;
  background:transparent;
  color:white;
  border-radius:10px;
  padding:8px 11px;
  font-size:10px;
}
.sale-buttons .check{
  background:#fff;
  color:#222;
  border-color:#fff;
}

/* REVIEWS */
.review{
  background:#fff;
  border:1px solid #eee6de;
  border-radius:18px;
  padding:15px;
  margin-bottom:10px;
}
.review-top{
  display:flex;
  justify-content:space-between;
}
.review-name{
  font-weight:800;
  font-size:13px;
}
.review-date{
  font-size:10px;
  color:#aaa;
}
.stars{color:#ffb52f;font-size:13px}
.review p{
  font-size:12px;
  line-height:1.8;
  margin:8px 0 0;
  color:#555;
}
.review-score{
  display:flex;
  gap:5px;
  margin-top:9px;
  flex-wrap:wrap;
}
.review-score span{
  font-size:9px;
  background:#f5f1ec;
  padding:5px 7px;
  border-radius:7px;
}

/* FOOTER */
.footer{
  padding:35px 18px 80px;
  text-align:center;
  color:#999;
  font-size:10px;
}
.footer strong{
  display:block;
  color:#333;
  font-size:15px;
  margin-bottom:5px;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,100px);
  background:#252525;
  color:white;
  padding:12px 18px;
  border-radius:30px;
  font-size:12px;
  z-index:100;
  transition:.3s;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}
.toast.show{
  transform:translate(-50%,0);
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:90;
  align-items:flex-end;
}
.modal.show{display:flex}
.modal-inner{
  width:100%;
  max-width:560px;
  margin:auto;
  max-height:90vh;
  overflow:auto;
  background:#fffaf5;
  border-radius:28px 28px 0 0;
  padding:22px;
}
.modal-close{
  float:right;
  border:0;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
}
.modal h2{
  margin:5px 40px 8px 0;
}
.modal p{
  font-size:13px;
  line-height:1.8;
  color:#555;
}
.rating-big{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.rating-box{
  background:white;
  border-radius:14px;
  padding:11px;
}
.rating-box b{
  display:block;
  font-size:20px;
}
.rating-box span{
  color:#999;
  font-size:10px;
}

/* EMPTY */
.empty{
  text-align:center;
  padding:45px 15px;
  color:#999;
}
.empty b{
  display:block;
  font-size:40px;
  margin-bottom:10px;
}

/* RESPONSIVE */
@media(min-width:700px){
  .app{
    box-shadow:0 0 60px rgba(0,0,0,.08);
  }
}
</style>
</head>

<body>
<div class="app">

<header class="header">
  <div class="logo">
    <div>
      <h1>ベビ<span>キッズ</span></h1>
      <div class="tagline">子供も楽しい、親も楽しい。</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="showFavorites()">❤️</button>
    </div>
  </div>
</header>

<nav class="nav">
  <button class="active" onclick="filterHotels('all',this)">おすすめ</button>
  <button onclick="filterHotels('onsen',this)">♨️ 温泉</button>
  <button onclick="filterHotels('sea',this)">🏖️ 海</button>
  <button onclick="filterHotels('nature',this)">🌲 自然</button>
  <button onclick="filterHotels('pool',this)">🏊 プール</button>
</nav>

<section class="hero">
  <h2>子供だけじゃない。<br><span>親も楽しめる宿。</span></h2>
  <p>
    実際に泊まったパパ・ママの目線で、
    「ここなら家族みんなが楽しめる」を探すホテルサイト。
  </p>
</section>

<div id="deck" class="deck"></div>

<div class="swipe-actions">
  <button class="swipe-btn no" onclick="swipe('no')">👎</button>
  <button class="swipe-btn yes" onclick="swipe('yes')">❤️</button>
</div>

<section class="section">
  <div class="section-head">
    <h3>🔥 今チェックしたいセール</h3>
    <span>気になるものだけ</span>
  </div>
  <div id="sales"></div>
</section>

<section class="section">
  <div class="section-head">
    <h3>💬 宿泊体験レビュー</h3>
    <span>リアルな家族目線</span>
  </div>
  <div id="reviews"></div>
</section>

<footer class="footer">
  <strong>ベビキッズ</strong>
  子供も楽しい、親も楽しい。
  <br><br>
  ※掲載内容は編集部・利用者の宿泊体験をもとにした情報です。
</footer>

<div id="toast" class="toast"></div>

<div id="modal" class="modal" onclick="closeModal(event)">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

</div>

<script>

/* =====================================================
   HOTEL DATABASE
   ===================================================== */

const hotels = [

{
 id:"halekulani",
 name:"ハレクラニ沖縄",
 area:"沖縄・恩納村",
 type:["sea"],
 score:4.8,
 child:4.6,
 parent:4.9,
 food:4.7,
 bath:4.5,
 play:4.2,
 cost:3.2,
 tags:["スタッフ力","海","プール","パンケーキ"],
 badge:"親満足度が高い",
 image:"",
 short:"スタッフのサービス力が圧倒的。高いけど、オフシーズンなら狙い目。",
 experience:
 "スタッフ力はディズニー並みという印象。夕食のHouse Without A Keyのライブは雰囲気が最高。プールも圧倒的に気持ちいい。価格は高めなので、庶民目線ならオフシーズンがおすすめ。",
 highlight:
 "朝食のパンケーキも有名。子連れでも落ち着いて座りやすく、朝の時間を家族で楽しみやすい。",
 stay:"オフシーズンでも十分楽しめる",
 recommendation:"親の満足度を重視する家族に"
},

{
 id:"haimuru",
 name:"はいむるぶし",
 area:"沖縄・小浜島",
 type:["sea"],
 score:4.9,
 child:4.8,
 parent:4.9,
 food:4.7,
 bath:4.0,
 play:4.9,
 cost:3.7,
 tags:["絶景","水牛","プール","南十字星"],
 badge:"リゾート感★★★★★",
 short:"遠い。でも、行ってしまえば最高。2泊以上推奨。",
 experience:
 "子連れだと行くまでが大変なので2泊以上がおすすめ。でも到着してしまえば最高。綺麗な海と子供も楽しめるプール、バギーカート、水牛、昆虫博物館など、とにかく非日常感がすごい。",
 highlight:
 "夜は南十字星。食事も楽しめる。『ここに来ないと味わえない』というリゾート感は唯一無二。",
 stay:"2泊以上がおすすめ",
 recommendation:"海とリゾートを思い切り楽しみたい家族に"
},

{
 id:"shigira",
 name:"シギラベイサイドスイート アラマンダ",
 area:"沖縄・宮古島",
 type:["sea","pool"],
 score:4.6,
 child:4.8,
 parent:4.5,
 food:4.1,
 bath:4.0,
 play:4.8,
 cost:4.0,
 tags:["宮古島","ウミガメ","プール","海"],
 badge:"海・プール派に",
 short:"海とプール好きならかなり強い。南国感はトップクラス。",
 experience:
 "ホテル内プールの南国感が最高。プールサイドでビールやメロンパフェを楽しめる。ウミガメへの餌やりも子供が大喜び。ウミガメのぬいぐるみまで欲しくなる。",
 highlight:
 "朝食は雪塩ホイップバターを焼いたパンに乗せるのが個人的な大ヒット。夕食はリゾート内に選択肢が多いので早めの予約がおすすめ。",
 stay:"2泊以上でも楽しみやすい",
 recommendation:"海・プールを中心に遊びたい家族に"
},

{
 id:"key",
 name:"THE KEY HIGHLAND NASU",
 area:"栃木・那須",
 type:["onsen","pool","nature"],
 score:4.9,
 child:4.8,
 parent:5.0,
 food:5.0,
 bath:5.0,
 play:4.6,
 cost:4.3,
 tags:["森のスパ","サウナ","オールインクルーシブ","食事"],
 badge:"編集部イチオシ",
 short:"食事・温泉・サウナが強すぎる。周辺観光も充実。",
 experience:
 "夕食・朝食のレベルが高すぎる。ワインに合うものも多く、子連れが多いのにホテル内は大人専用のような落ち着いた雰囲気。",
 highlight:
 "室内プールがあるので小さい子供連れもOK。そして森のスパが唯一無二。森の中の露天風呂とサウナは、妻から『もう一度行きたい』と何度も言われるほど。",
 stay:"1泊でも満足度が高い",
 recommendation:"親も本気で癒やされたい家族に"
},

{
 id:"tomamu",
 name:"星野リゾート リゾナーレトマム",
 area:"北海道・トマム",
 type:["nature","pool"],
 score:4.8,
 child:4.9,
 parent:4.8,
 food:4.7,
 bath:4.1,
 play:5.0,
 cost:3.8,
 tags:["雲海","牧場","バギー","鹿"],
 badge:"6歳未満なら特に",
 short:"広いスイート、ジャグジー、アクティビティ。3泊でも足りない。",
 experience:
 "トマム・ザ・タワーと悩むけど、6歳未満なら個人的にはリゾナーレ。部屋が広いスイートでジャグジーもあり、雲海ワゴンでも並ばなくて済むのが嬉しい。",
 highlight:
 "通路に普通に鹿がいて子供が大興奮。バギー、牛への餌やり、子牛へのミルクなどアクティビティも豊富。ホタルストリートの食事や毎晩の花火も楽しい。",
 stay:"3泊でも足りない",
 recommendation:"子供中心の北海道旅行をしたい家族に"
},

{
 id:"yatsugatake",
 name:"グランドメルキュール八ヶ岳",
 area:"山梨・八ヶ岳",
 type:["onsen","nature"],
 score:4.7,
 child:4.9,
 parent:4.8,
 food:4.4,
 bath:4.8,
 play:5.0,
 cost:4.6,
 tags:["遊び場","温泉","ラウンジ","星空"],
 badge:"子連れ旅行の本命",
 short:"父は子供と遊ぶ、母は温泉。最後は家族でラウンジ。",
 experience:
 "子供を遊ばせながら親もそれぞれ楽しめるバランスが魅力。父親が子供と遊んでいる間に母親が温泉へ、そして風呂上がりは家族でラウンジ。",
 highlight:
 "近くに牧場・動物園など子供が遊べる場所が多い。風呂上がりの甘酒を家族で楽しみ、夜は星空が格別。『子供も楽しい、親も楽しい』を一番イメージしやすい宿。",
 stay:"1〜2泊に向く",
 recommendation:"家族旅行初心者にもおすすめ"
}

];


/* =====================================================
   STATE
   ===================================================== */

let currentHotels=[...hotels];
let currentIndex=0;

let liked=JSON.parse(localStorage.getItem("babyKidsLiked")||"[]");
let rejected=JSON.parse(localStorage.getItem("babyKidsRejected")||"[]");
let dismissedSales=JSON.parse(localStorage.getItem("babyKidsSales")||"[]");


/* =====================================================
   CARD
   ===================================================== */

function renderDeck(){

 const deck=document.getElementById("deck");

 if(currentIndex>=currentHotels.length){
   deck.innerHTML=`
   <div class="empty">
     <b>🎉</b>
     <strong>全部チェックしました！</strong>
     <p>気になる宿をもう一度見たい？</p>
     <button onclick="resetDeck()" style="
       border:0;
       background:#252525;
       color:white;
       padding:12px 20px;
       border-radius:20px;
     ">もう一度見る</button>
   </div>`;
   return;
 }

 const visible=currentHotels.slice(currentIndex,currentIndex+3);

 deck.innerHTML=visible.map((hotel,i)=>{

   return `
   <article class="card" data-id="${hotel.id}" style="z-index:${10-i};transform:scale(${1-i*.035}) translateY(${i*10}px)">
     
     <div class="card-image">

       ${i===0?`<div class="badge">${hotel.badge}</div>`:""}

       <button class="favorite" onclick="event.stopPropagation();toggleLike('${hotel.id}')">
         ${liked.includes(hotel.id)?"❤️":"♡"}
       </button>

       <div>
         <div class="place">${hotel.area}</div>
         <div class="card-title">${hotel.name}</div>
       </div>

     </div>

     <div class="card-body">

       <div class="score-row">
         <div>
           <div class="score">${hotel.score}<small>/5.0</small></div>
           <div style="font-size:10px;color:#999">ベビキッズ体験スコア</div>
         </div>

         <button onclick="openHotel('${hotel.id}')" style="
           border:0;
           background:#f5f1ec;
           padding:9px 12px;
           border-radius:12px;
           font-size:10px;
         ">詳しく見る</button>
       </div>

       <div class="tags">
         ${hotel.tags.map(t=>`<span class="tag">${t}</span>`).join("")}

/* =====================================================
   SWIPE
   ===================================================== */

function enableSwipe(){

 const card=document.querySelector(".card");
 if(!card)return;

 let startX=0;
 let currentX=0;
 let dragging=false;

 card.addEventListener("pointerdown",e=>{
   if(e.target.closest("button"))return;
   startX=e.clientX;
   dragging=true;
   card.setPointerCapture(e.pointerId);
 });

 card.addEventListener("pointermove",e=>{
   if(!dragging)return;
   currentX=e.clientX-startX;
   card.style.transform=`translateX(${currentX}px) rotate(${currentX/18}deg)`;
 });

 card.addEventListener("pointerup",()=>{
   if(!dragging)return;
   dragging=false;

   if(Math.abs(currentX)>100){
      swipe(currentX>0?"yes":"no");
   }else{
      card.style.transform="";
      renderDeck();
   }
   currentX=0;
 });
}


function swipe(type){

 const hotel=currentHotels[currentIndex];
 if(!hotel)return;

 const card=document.querySelector(".card");

 if(type==="yes"){

   if(!liked.includes(hotel.id)){
     liked.push(hotel.id);
     localStorage.setItem("babyKidsLiked",JSON.stringify(liked));
   }

   if(card){
     card.style.transform="translateX(120%) rotate(20deg)";
     card.style.opacity="0";
   }

   toast(`❤️ ${hotel.name}をお気に入りに追加`);

 }else{

   if(!rejected.includes(hotel.id)){
     rejected.push(hotel.id);
     localStorage.setItem("babyKidsRejected",JSON.stringify(rejected));
   }

   if(card){
     card.style.transform="translateX(-120%) rotate(-20deg)";
     card.style.opacity="0";
   }

   toast("今回はスキップしました");
 }

 currentIndex++;

 setTimeout(renderDeck,260);
}

function closeModal(e){

 }
}


/* =====================================================

   ===================================================== */

let toastTimer;

function toast(message){

 const el=document.getElementById("toast");

 el.textContent=message;
 el.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=setTimeout(()=>{
   el.classList.remove("show");
 },1800);
}
