

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf5">

<title>ベビキッズ｜子供も楽しい、親も楽しい。</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#eeeae5;
  color:#242424;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}

/* =========================
   APP
========================= */

.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  margin:auto;
  background:#fffaf5;
  box-shadow:0 0 50px rgba(0,0,0,.08);
}

/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:50;

  background:rgba(255,250,245,.94);
  backdrop-filter:blur(15px);

  padding:
    13px
    16px
    8px;

  border-bottom:1px solid #eee5dc;
}

.headerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:-1.5px;
}

.logo span{
  color:#ff665d;
}

.logoSub{
  font-size:10px;
  color:#999;
  margin-top:2px;
}

.headerButtons{
  display:flex;
  gap:7px;
}

.roundButton{
  width:40px;
  height:40px;

  border:0;
  border-radius:50%;

  background:#fff;

  box-shadow:
    0 4px 15px rgba(0,0,0,.08);
}

/* =========================
   CATEGORY NAV
========================= */

.categoryNav{
  display:flex;
  gap:7px;

  overflow-x:auto;

  padding:
    9px
    13px
    4px;

  scrollbar-width:none;
}

.categoryNav::-webkit-scrollbar{
  display:none;
}

.categoryButton{
  white-space:nowrap;

  border:1px solid #e6ddd4;

  background:#fff;

  padding:
    8px
    13px;

  border-radius:20px;

  font-size:11px;
}

.categoryButton.active{
  background:#242424;
  color:#fff;
  border-color:#242424;
}

/* =========================
   HERO
========================= */

.hero{
  padding:
    19px
    17px
    10px;
}

.hero h1{
  margin:0;

  font-size:28px;
  line-height:1.25;

  letter-spacing:-1.5px;
}

.hero h1 span{
  color:#ff665d;
}

.hero p{
  margin:
    8px
    0
    0;

  color:#777;

  font-size:12px;
  line-height:1.7;
}

/* =========================
   SEARCH
========================= */

.searchBox{
  margin:
    5px
    16px
    13px;

  display:flex;
  gap:7px;
}

.searchInput{
  flex:1;

  min-width:0;

  border:1px solid #e4ddd6;

  background:#fff;

  border-radius:13px;

  padding:
    11px
    13px;

  outline:none;

  font-size:12px;
}

.searchInput:focus{
  border-color:#ff665d;
}

.searchButton{
  width:46px;

  border:0;

  border-radius:13px;

  background:#242424;

  color:#fff;
}

/* =========================
   FILTER
========================= */

.filterArea{
  padding:
    0
    16px
    12px;
}

.filterScroll{
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
}

.filterScroll::-webkit-scrollbar{
  display:none;
}

.filterChip{
  white-space:nowrap;

  border:1px solid #e7dfd7;

  background:#fff;

  border-radius:20px;

  padding:
    7px
    10px;

  font-size:10px;
}

.filterChip.active{
  background:#ffe6e2;
  border-color:#ffaaa2;
  color:#c8473f;
}

/* =========================
   SWIPE DECK
========================= */

.deckWrap{
  margin:
    0
    13px;
}

.deck{
  position:relative;

  height:600px;

  overflow:visible;
}

.card{
  position:absolute;

  inset:0;

  overflow:hidden;

  background:#fff;

  border-radius:25px;

  box-shadow:
    0 15px 45px rgba(45,32,20,.15);

  transition:
    transform .25s ease,
    opacity .25s ease;

  user-select:none;

  /*
    ここが重要。
    縦方向はブラウザのスクロールを優先。
  */
  touch-action:pan-y;
}

.cardImage{
  height:270px;

  position:relative;

  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}

.cardShade{
  position:absolute;
  inset:35% 0 0;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.78)
    );
}

.cardBadge{
  position:absolute;

  top:14px;
  left:14px;

  z-index:3;

  background:#ff665d;
  color:#fff;

  padding:
    6px
    10px;

  border-radius:20px;

  font-size:9px;
  font-weight:800;
}

.cardHeart{
  position:absolute;

  z-index:4;

  right:13px;
  top:13px;

  width:43px;
  height:43px;

  border:0;
  border-radius:50%;

  background:rgba(255,255,255,.94);

  font-size:19px;
}

.cardImageText{
  position:absolute;

  z-index:3;

  left:17px;
  right:17px;
  bottom:15px;

  color:#fff;
}

.cardArea{
  font-size:10px;
}

.cardName{
  font-size:22px;
  font-weight:900;

  line-height:1.25;
}

/* =========================
   CARD BODY
========================= */

.cardBody{
  padding:
    13px
    16px;
}

.scoreRow{
  display:flex;

  justify-content:space-between;
  align-items:center;
}

.score{
  font-size:28px;
  font-weight:900;
}

.score small{
  color:#aaa;
  font-size:10px;
  font-weight:500;
}

.detailButton{
  border:0;

  background:#f4eee8;

  border-radius:12px;

  padding:
    9px
    11px;

  font-size:10px;
}

.tags{
  display:flex;

  gap:5px;

  overflow:hidden;

  margin:
    8px
    0;
}

.tag{
  white-space:nowrap;

  background:#f7f2ec;

  padding:
    5px
    8px;

  border-radius:8px;

  font-size:9px;
}

.story{
  font-size:11px;

  line-height:1.65;

  color:#555;

  margin:
    7px
    0;
}

.story strong{
  color:#222;
}

.metrics{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:5px;
}

.metric{
  background:#faf7f3;

  border-radius:10px;

  padding:7px 3px;

  text-align:center;
}

.metric b{
  display:block;

  font-size:14px;
}

.metric span{
  font-size:8px;
  color:#999;
}

/* =========================
   SWIPE BUTTONS
========================= */

.swipeActions{
  display:flex;

  justify-content:center;

  gap:18px;

  margin:
    16px
    0
    14px;
}

.swipeButton{
  width:60px;
  height:60px;

  border:0;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 7px 25px rgba(0,0,0,.12);

  font-size:23px;
}

.swipeNo{
  color:#777;
}

.swipeYes{
  color:#ff5d68;
}

.swipeHint{
  text-align:center;

  color:#aaa;

  font-size:9px;

  margin-bottom:20px;
}

/* =========================
   SECTION
========================= */

.section{
  padding:
    20px
    16px;
}

.sectionHeader{
  display:flex;

  align-items:end;

  justify-content:space-between;

  margin-bottom:12px;
}

.sectionHeader h2{
  margin:0;

  font-size:19px;
}

.sectionHeader span{
  font-size:9px;
  color:#999;
}

/* =========================
   SALE
========================= */

.saleCard{
  background:#242424;

  color:#fff;

  border-radius:20px;

  padding:16px;

  margin-bottom:10px;
}

.saleBadge{
  display:inline-block;

  background:#ff665d;

  padding:
    5px
    8px;

  border-radius:7px;

  font-size:8px;

  font-weight:800;
}

.saleCard h3{
  font-size:16px;

  margin:
    8px
    0
    4px;
}

.saleCard p{
  color:#ccc;

  font-size:10px;

  line-height:1.6;

  margin:0;
}

.saleButtons{
  display:flex;

  gap:7px;

  margin-top:11px;
}

.saleButtons button{
  border:
    1px solid #555;

  background:transparent;

  color:#fff;

  border-radius:9px;

  padding:
    8px
    10px;

  font-size:9px;
}

.saleButtons .primary{
  background:#fff;
  color:#222;
}

/* =========================
   REVIEWS
========================= */

.review{
  background:#fff;

  border:
    1px solid #eee4db;

  border-radius:17px;

  padding:14px;

  margin-bottom:9px;
}

.reviewTop{
  display:flex;

  justify-content:space-between;
}

.reviewHotel{
  font-size:12px;

  font-weight:800;
}

.reviewMeta{
  color:#999;

  font-size:9px;

  margin-top:2px;
}

.stars{
  color:#f1a92b;

  font-size:12px;
}

.review p{
  color:#555;

  font-size:11px;

  line-height:1.75;

  margin:
    7px
    0;
}

.reviewTags{
  display:flex;

  flex-wrap:wrap;

  gap:4px;
}

.reviewTags span{
  background:#f5f0ea;

  padding:
    5px
    6px;

  border-radius:7px;

  font-size:8px;
}

/* =========================
   CTA
========================= */

.cta{
  margin:
    5px
    16px
    20px;

  padding:17px;

  background:#ffe8e4;

  border-radius:20px;
}

.cta h2{
  font-size:17px;

  margin:
    0
    0
    5px;
}

.cta p{
  color:#666;

  font-size:10px;

  line-height:1.6;

  margin:
    0
    0
    10px;
}

.cta button{
  border:0;

  background:#ff665d;

  color:#fff;

  padding:
    10px
    14px;

  border-radius:11px;

  font-size:10px;

  font-weight:800;
}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;

  color:#aaa;

  font-size:9px;

  padding:
    30px
    15px
    80px;
}

.footer strong{
  display:block;

  color:#333;

  font-size:14px;

  margin-bottom:5px;
}

/* =========================
   MODAL
========================= */

.modal{
  display:none;

  position:fixed;

  inset:0;

  z-index:100;

  background:rgba(0,0,0,.62);

  align-items:flex-end;

  justify-content:center;
}

.modal.show{
  display:flex;
}

.modalSheet{
  width:100%;

  max-width:620px;

  max-height:92vh;

  overflow-y:auto;

  background:#fffaf5;

  border-radius:
    27px
    27px
    0
    0;

  padding:20px;
}

.closeButton{
  float:right;

  width:36px;
  height:36px;

  border:0;

  border-radius:50%;

  background:#eee;
}

/* =========================
   DETAIL
========================= */

.detailGallery{
  display:flex;

  gap:7px;

  overflow-x:auto;

  margin:
    0
    -20px
    15px;

  padding:
    0
    20px;
}

.detailGallery img{
  width:250px;
  height:180px;

  object-fit:cover;

  border-radius:17px;
}

.detailTitle{
  font-size:23px;

  margin:
    5px
    45px
    5px
    0;
}

.bigScore{
  font-size:32px;

  font-weight:900;
}

.ratingGrid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:7px;

  margin:
    10px
    0;
}

.ratingBox{
  background:#fff;

  border-radius:13px;

  padding:11px;
}

.ratingBox b{
  display:block;

  font-size:20px;
}

.ratingBox span{
  font-size:9px;

  color:#999;
}

.bookingButton{
  display:block;

  width:100%;

  margin-top:12px;

  padding:14px;

  background:#242424;

  color:#fff;

  text-decoration:none;

  text-align:center;

  border-radius:13px;

  font-size:12px;

  font-weight:900;
}

/* =========================
   FORM
========================= */

.form label{
  display:block;

  font-size:10px;

  font-weight:800;

  margin:
    12px
    0
    5px;
}

.form input,
.form textarea,
.form select{
  width:100%;

  border:
    1px solid #dfd8d1;

  background:#fff;

  border-radius:11px;

  padding:10px;

  font-size:12px;

  outline:none;
}

.form textarea{
  min-height:110px;

  resize:vertical;
}

.formSubmit{
  width:100%;

  border:0;

  background:#ff665d;

  color:#fff;

  padding:13px;

  border-radius:12px;

  margin-top:13px;

  font-weight:800;
}

.starInput{
  font-size:27px;

  letter-spacing:3px;

  color:#ccc;
}

.starInput span.active{
  color:#f1a92b;
}

/* =========================
   PROFILE
========================= */

.profileCard{
  background:#fff;

  border:
    1px solid #eee5dd;

  border-radius:17px;

  padding:15px;

  margin-bottom:9px;
}

.profileRow{
  display:flex;

  justify-content:space-between;
}

.profileCard p{
  font-size:11px;

  line-height:1.7;

  color:#666;
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;

  color:#999;

  padding:50px 10px;
}

.emptyIcon{
  font-size:40px;

  display:block;

  margin-bottom:8px;
}

.resetButton{
  border:0;

  background:#242424;

  color:#fff;

  padding:
    11px
    18px;

  border-radius:18px;

  font-size:11px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  z-index:200;

  left:50%;

  bottom:22px;

  transform:
    translate(-50%,100px);

  background:#242424;

  color:#fff;

  padding:
    11px
    17px;

  border-radius:25px;

  font-size:11px;

  transition:.25s;

  box-shadow:
    0 8px 25px rgba(0,0,0,.25);

  white-space:nowrap;
}

.toast.show{
  transform:
    translate(-50%,0);
}

/* =========================
   SEARCH RESULTS
========================= */

.searchResults{
  display:none;

  padding:
    0
    16px
    15px;
}

.searchResults.show{
  display:block;
}

.resultCard{
  background:#fff;

  border:
    1px solid #eee5dc;

  border-radius:15px;

  padding:12px;

  display:flex;

  gap:10px;

  margin-bottom:7px;
}

.resultCard img{
  width:90px;
  height:70px;

  object-fit:cover;

  border-radius:10px;
}

.resultInfo{
  flex:1;
}

.resultInfo strong{
  font-size:12px;
}

.resultInfo p{
  margin:4px 0;

  font-size:9px;

  color:#999;
}

.resultInfo button{
  border:0;

  background:#242424;

  color:#fff;

  padding:
    6px
    9px;

  border-radius:8px;

  font-size:8px;
}

</style>
</head>

<body>

<div class="app">

<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="headerTop">

    <div>

      <div class="logo">
        ベビ<span>キッズ</span>
      </div>

      <div class="logoSub">
        子供も楽しい、親も楽しい。
      </div>

    </div>

    <div class="headerButtons">

      <button
        class="roundButton"
        onclick="openFavorites()">

      <button

        onclick="openProfile()">
        👤
      </button>

    </div>

  </div>

</header>


<!-- =========================
     CATEGORY
========================= -->

<nav class="categoryNav">

  <button
    class="categoryButton active"
    onclick="filterHotels('all',this)">
    おすすめ
  </button>

  <button
    class="categoryButton"
    onclick="filterHotels('onsen',this)">
    ♨️ 温泉
  </button>

  <button
    class="categoryButton"
    onclick="filterHotels('sea',this)">
    🏖️ 海
  </button>

  <button
    class="categoryButton"
    onclick="filterHotels('nature',this)">
    🌲 自然
  </button>

  <button
    class="categoryButton"
    onclick="filterHotels('pool',this)">
    🏊 プール
  </button>

</nav>


<!-- =========================
     HERO
========================= -->

<section class="hero">

  <h1>
    子供だけじゃない。<br>
    <span>親も楽しめる宿。</span>
  </h1>

  <p>
    パパ・ママ目線のリアルな体験を、

  </p>

</section>


<!-- =========================
     SEARCH
========================= -->

<div class="searchBox">

  <input
    id="searchInput"
    class="searchInput"

  </button>

  id="searchResults"
  class="searchResults">
</div>


<!-- =========================
     FILTER
========================= -->

<div class="filterArea">

  <div class="filterScroll">

    <button
      class="filterChip active"
      onclick="setBudget('all',this)">
      予算すべて
    </button>

    <button
      class="filterChip"
      onclick="setBudget(2,this)">
      ～2万円
    </button>

    <button
      class="filterChip"
      onclick="setBudget(3,this)">
      ～3万円
    </button>

    <button
      class="filterChip"
      onclick="setBudget(4,this)">
      ～5万円
    </button>

      class="filterChip"

    </button>

    <button
      class="filterChip"

========================= -->

</section>

  id="toast"

<script>

/* ============================================================
   HOTEL DATA
============================================================ */

const hotels = [

{
  id:"halekulani",

  name:"ハレクラニ沖縄",

  area:"沖縄・恩納村",

  type:["sea","pool"],

  score:4.8,

  child:4.6,
  parent:4.9,
  food:4.7,
  bath:4.5,
  play:4.2,
  cost:3.2,

  budget:5,

  ages:["baby","kid","school"],

  tags:[
    "スタッフ力",
    "海",
    "プール",
    "パンケーキ"
  ],

/* ============================================================
   SWIPE
============================================================ */

function enableSwipe(){

  const card=
    document.querySelector(".card");

  if(!card){
    return;
  }


  let startX=0;
  let deltaX=0;
  let dragging=false;


  card.addEventListener(
    "pointerdown",
    event=>{

      if(
        event.target.closest("button")
      ){
        return;
      }

      startX=
        event.clientX;

      deltaX=0;

      dragging=true;

      card.setPointerCapture(
        event.pointerId
      );

    }
  );


  card.addEventListener(
    "pointermove",
    event=>{

      if(!dragging){
        return;
      }

      deltaX=
        event.clientX-startX;

      /*
        縦スクロールを邪魔しないため、
        横方向に十分動いた時だけ
        カードを動かす。
      */

      if(
        Math.abs(deltaX)>15
      ){

        card.style.transform=
          `translateX(${deltaX}px)
           rotate(${deltaX/22}deg)`;

      }

    }
  );


  card.addEventListener(
    "pointerup",
    ()=>{

      if(!dragging){
        return;
      }

      dragging=false;


      if(
        Math.abs(deltaX)>100
      ){

        swipe(
          deltaX>0
          ? "yes"
          : "no"
        );

      }else{

        card.style.transform=
          "translateY(0)";

      }

    }
  );

}


/* ============================================================
   SWIPE ACTION
============================================================ */

function swipe(type){

  const hotel=
    currentHotels[currentIndex];

  if(!hotel){
    return;
  }


  const card=
    document.querySelector(".card");


  if(type==="yes"){

    if(
      !liked.includes(hotel.id)
    ){

      liked.push(hotel.id);

    }

    save(
      "bk_liked",
      liked
    );


    if(card){

      card.style.transform=
        "translateX(120%) rotate(18deg)";

      card.style.opacity="0";

    }

    toast(
      "❤️ お気に入りに追加しました"
    );

  }


  else{

    if(
      !rejected.includes(hotel.id)
    ){

      rejected.push(hotel.id);

    }

    save(
      "bk_rejected",
      rejected
    );


    if(card){

      card.style.transform=
        "translateX(-120%) rotate(-18deg)";

      card.style.opacity="0";

    }

    toast(
      "👎 今回はスキップしました"
    );

  }


  currentIndex++;

  setTimeout(
    renderDeck,
    250
  );

}


/* ============================================================
   CATEGORY FILTER
============================================================ */

function filterHotels(type,button){

  document
    .querySelectorAll(".categoryButton")
    .forEach(
      b=>b.classList.remove("active")
    );


  button.classList.add("active");


  if(type==="all"){

    currentHotels=
      [...hotels];

  }

  else{

    currentHotels=
      hotels.filter(
        hotel=>
          hotel.type.includes(type)
      );

  }


  applyFilters();

}


/* ============================================================
   BUDGET
============================================================ */

function setBudget(value,button){

  document
    .querySelectorAll(".filterChip")
    .forEach(
      b=>b.classList.remove("active")
    );

  button.classList.add("active");

  selectedBudget=value;

  applyFilters();

}


/* ============================================================
   AGE
============================================================ */

function setAge(value,button){

  document
    .querySelectorAll(".filterChip")
    .forEach(
      b=>b.classList.remove("active")
    );

  button.classList.add("active");

  selectedAge=value;

  applyFilters();

}


/* ============================================================
   APPLY FILTERS
============================================================ */

function applyFilters(){

  let result=[...hotels];


  if(selectedBudget!=="all"){

    result=
      result.filter(
        hotel=>
          hotel.budget<=selectedBudget
      );

  }


  if(selectedAge){

    result=
      result.filter(
        hotel=>
          hotel.ages.includes(
            selectedAge
          )
      );

  }


  currentHotels=result;

  currentIndex=0;

  renderDeck();

}


/* ============================================================
   RESET
============================================================ */

function resetDeck(){

  currentHotels=
    [...hotels];

  currentIndex=0;

  selectedBudget="all";

  selectedAge=null;

  renderDeck();

}


/* ============================================================

============================================================ */

function toggleLike(id){

  if(
    liked.includes(id)
  ){

    liked=
      liked.filter(
        x=>x!==id
      );

    toast(
      "お気に入りから外しました"
    );

  }

  else{

    liked.push(id);

    toast(
      "❤️ お気に入りに追加しました"
    );

  }


  save(
    "bk_liked",
    liked
  );


  renderDeck();

}

function searchHotels(){

  const keyword=
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  const results=
    document.getElementById(
      "searchResults"
    );


  if(!keyword){

    results.classList.remove(
      "show"
    );

    results.innerHTML="";

    return;

  }


  const found=
    hotels.filter(
      hotel=>

        hotel.name
          .toLowerCase()
          .includes(keyword)

        ||

        hotel.area
          .toLowerCase()
          .includes(keyword)

        ||

        hotel.tags.some(
          tag=>
            tag.toLowerCase()
              .includes(keyword)
        )

    );


  results.classList.add(
    "show"
  );


  if(!found.length){

    results.innerHTML=`

      <div class="empty">

        <span class="emptyIcon">
          🔎
        </span>

        見つかりませんでした。

      </div>

    `;

    return;

  }


  results.innerHTML=
    found.map(
      hotel=>`

        <div class="resultCard">

          <img
            src="${hotel.images[0]}"
            alt="${hotel.name}"
          >

          <div class="resultInfo">

            <strong>
              ${hotel.name}
            </strong>

            <p>
              ${hotel.area}
              ｜⭐ ${hotel.score}

            <button
              onclick="
                openHotel('${hotel.id}')

            >
              詳しく見る
            </button>

          </div>

        </div>

      `
    ).join("");

}

function renderSales(){

  const container=
    document.getElementById(
      "sales"
    );


  const visible=
    sales.filter(
      sale=>
        !dismissedSales.includes(
          sale.id
        )
    );


  if(!visible.length){

    container.innerHTML=`

      <div class="review">

        <div
          style="
            text-align:center;
            color:#999;
            padding:15px;
          "
        >
          現在表示できるセール情報はありません。

        </div>

      </div>

    `;

    return;

  }


  container.innerHTML=
    visible.map(
      sale=>`

        <div class="saleCard">

          <span class="saleBadge">
            🔥 PICK UP
          </span>

          <h3>
            ${sale.hotel}
          </h3>

          <p>
            ${sale.title}
            <br>
            ${sale.text}
          </p>

          <div class="saleButtons">

            <button
              class="primary"
              onclick="
                saleCheck('${sale.id}')
              "
            >
              気になる
            </button>

            <button
              onclick="
                dismissSale('${sale.id}')
              "
            >
              今回は違う
            </button>

          </div>

        </div>

      `
    ).join("");

}


function saleCheck(id){

  const sale=
    sales.find(
      s=>s.id===id
    );

  toast(
    "🔥 "
    + sale.hotel
    + "をチェックしました"
  );

}


function dismissSale(id){

  dismissedSales.push(id);

  save(
    "bk_sales",
    dismissedSales
  );

  renderSales();

  toast(
    "この情報を非表示にしました"
  );

}

/* ============================================================
   STAR
============================================================ */

function setStars(number){

  document.getElementById(
    "reviewScore"
  ).value=number;


  document
    .querySelectorAll(
      "#starInput span"
    )
    .forEach(
      (star,index)=>{

        star.classList.toggle(
          "active",
          index<number
        );

      }
    );

}


/* ============================================================
   SUBMIT REVIEW
============================================================ */

function submitReview(){

  const text=
    document
      .getElementById(
        "reviewText"
      )
      .value
      .trim();


  if(text.length<5){

    toast(
      "口コミを5文字以上入力してください"
    );

    return;

  }


  const hotel=
    document.getElementById(
      "reviewHotel"
    ).value;


  const score=
    Number(
      document.getElementById(
        "reviewScore"
      ).value
    );


  const tags=
    document
      .getElementById(
        "reviewTags"
      )
      .value
      .split(",")

      .map(
        x=>x.trim()
      )

      .filter(
        Boolean
      );


  const review={

    hotel,

    user:"あなた",

    score,

    text,

    tags,

    date:
      new Date()
        .toLocaleDateString(
          "ja-JP"
        )

  };


  userReviews.unshift(
    review
  );


  save(
    "bk_reviews",
    userReviews
  );


  closeModal();

  renderReviews();


  toast(
    "🎉 口コミを投稿しました"
  );

}

/* ============================================================
   MODAL
============================================================ */

function openModal(html){

  document.getElementById(
    "modalBody"
  ).innerHTML=html;


  document.getElementById(
    "modal"
  ).classList.add("show");

}


function closeModal(event){

  if(
    !event ||
    event.target.id==="modal"
  ){

    document.getElementById(
      "modal"
    ).classList.remove(
      "show"
    );

  }

}


/* ============================================================
   TOAST
============================================================ */

function toast(message){

  const element=
    document.getElementById(
      "toast"
    );


  element.textContent=
    message;


  element.classList.add(
    "show"
  );


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer=
    setTimeout(
      ()=>{
        element.classList.remove(
          "show"
        );
      },
      1800
    );

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      character=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[character])
    );

}
